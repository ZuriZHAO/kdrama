<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>投稿取景地 · 剧场之外</title>
  <link rel="stylesheet" href="./submit.css?v=7" />
</head>
<body>
  <main class="page">
    <header class="top"><a href="./index.html">← 返回地图</a><span>剧场之外</span></header>
    <h1>分享一个韩剧取景地</h1>
    <p class="intro">跟着地图选点、填写场景、确认后提交。资料会先进入待审核区，核对后才会显示在地图上。</p>
    <ol class="steps" aria-label="投稿步骤"><li class="active">1 选择</li><li>2 地点与场景</li><li>3 检查提交</li></ol>
    <form id="submission-form" novalidate>
      <section class="step-panel" data-step="0">
        <label>我想投稿
          <select id="kind">
            <option value="place">新增取景地</option>
            <option value="scene">补充已有地点的场景</option>
            <option value="correction">纠正已有地点</option>
          </select>
        </label>
        <div id="work-fields">
          <label>搜索韩剧<input id="work-search" type="search" placeholder="输入作品名称" autocomplete="off" /></label>
          <label>选择作品<select id="work-id"></select></label>
          <div id="new-work-fields" hidden>
            <label>新作品中文名<input id="work-title" maxlength="120" /></label>
            <label>韩文原名<input id="work-original" maxlength="120" /></label>
          </div>
        </div>
        <div id="landmark-fields" hidden><label>选择已有地点<select id="landmark-id"></select></label></div>
      </section>

      <section class="step-panel" data-step="1" hidden>
        <div id="place-fields">
          <label>地点名称<input id="place-name" maxlength="120" placeholder="例如：绿莎坪人行天桥" /></label>
          <p class="hint">先在<a href="./index.html">地图上点击位置</a>，坐标会自动填入；也可以在下面修改。暂不确定精确机位也可以投稿。</p>
          <div class="two"><label>纬度<input id="lat" type="number" step="any" inputmode="decimal" /></label><label>经度<input id="lng" type="number" step="any" inputmode="decimal" /></label></div>
        </div>
        <div id="scene-fields"><label>剧中的场景<textarea id="description" maxlength="800" rows="3" placeholder="谁在这里发生了什么？"></textarea></label></div>
        <div id="correction-fields" hidden>
          <label>哪里需要修改？<textarea id="reason" maxlength="800" rows="3" placeholder="请说明现有资料哪里不对"></textarea></label>
          <label>正确的地点名称（可选）<input id="correction-name" maxlength="120" /></label>
          <div class="two"><label>正确纬度（可选）<input id="correction-lat" type="number" step="any" /></label><label>正确经度（可选）<input id="correction-lng" type="number" step="any" /></label></div>
        </div>
      </section>

      <section class="step-panel" data-step="2" hidden>
        <div id="scene-details">
          <div class="two"><label>集数（可选）<input id="episode" type="number" min="0" max="1000" /></label><label>播放时间，秒（可选）<input id="time-seconds" type="number" min="0" max="100000" /></label></div>
        </div>
        <label>资料来源链接（推荐）<input id="source-url" type="url" maxlength="1000" placeholder="https://..." /></label>
        <label>来源名称（可选）<input id="source-title" maxlength="160" placeholder="例如：韩国观光公社" /></label>
        <p class="hint">没有来源也可以先提交；维护者会在发布前核对或补充依据。</p>
        <div id="image-fields">
          <label>场景图片（可选）<input id="image" type="file" accept="image/jpeg,image/png,image/webp" /></label>
          <div id="image-rights" hidden>
            <label>图片署名<input id="image-credit" maxlength="160" placeholder="作者或授权方" /></label>
            <label class="check"><input id="rights-confirmed" type="checkbox" />我有权允许本站展示这张图片</label>
          </div>
        </div>
        <label>投稿署名（可选）<input id="contributor" maxlength="80" /></label>
        <div id="review-summary" class="review-summary" aria-live="polite"></div>
      </section>
      <input id="website" name="website" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <div class="form-actions"><button id="back-button" type="button" hidden>上一步</button><button id="next-button" type="button">下一步</button><button id="send-button" class="submit-button" type="submit" hidden>提交待审核</button></div>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
    </form>
    <section id="success-panel" class="success-panel" hidden><h2>已收到投稿</h2><p>资料已进入待审核区。核对通过后会出现在地图上。</p><a href="./index.html">返回地图</a></section>
  </main>
  <script src="./site-config.js?v=2"></script>
  <script src="./data/catalog.js?v=2"></script>
  <script src="./submit.js?v=7"></script>
</body>
</html>
