name: Publish K-drama pilgrimage map

on:
  push:
    branches: [main]
  issues:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: kdrama-pages
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  validate:
    if: github.event_name != 'issues' || github.event.label.name == 'publish-approved'
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check maintainer permission
        id: authorize
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/submission-status.cjs authorize
      - name: Check approved Issue snapshot
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/submission-status.cjs verify
      - name: Check scripts and catalog
        run: |
          node --check script.js
          node --check boot.js
          node --check submit.js
          node --check review.js
          node --check submission-core.js
          node --check tools/submission-status.cjs
          node data/check-catalog.cjs
          node tools/check-assets.cjs
          node tools/test-flow.cjs
          node tools/test-submission-core.cjs
          node tools/test-publication-status.cjs

  publish:
    needs: validate
    if: ${{ !github.event.repository.private && (github.event_name != 'issues' || github.event.label.name == 'publish-approved') }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      deployed: ${{ steps.deployment.outcome }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure submission labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/submission-status.cjs labels
      - name: Read the approved Issue
        id: approved
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/submission-status.cjs prepare
      - name: Import maintainer-approved Issue
        if: github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY_FILE: ${{ steps.approved.outputs.body_path }}
        run: |
          node tools/import-issue.cjs "$ISSUE_BODY_FILE" "$ISSUE_NUMBER"
      - name: Validate catalog and scripts
        run: |
          node --check script.js
          node --check boot.js
          node --check submit.js
          node --check review.js
          node --check submission-core.js
          node data/check-catalog.cjs
          node tools/check-assets.cjs
      - name: Build static site
        run: node tools/build-site.cjs
      - name: Recheck Issue before saving
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/submission-status.cjs verify
      - name: Save approved catalog update
        if: github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! git diff --quiet -- data/catalog.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalog.js
            git commit -m "Publish approved pilgrimage submission #$ISSUE_NUMBER"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment

  submission-receipt:
    needs: [validate, publish]
    if: ${{ always() && github.event_name == 'issues' && github.event.label.name == 'publish-approved' && needs.validate.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report publication outcome
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RESULT: ${{ needs.publish.outputs.deployed == 'success' && 'success' || needs.publish.result }}
          PAGE_URL: ${{ needs.publish.outputs.page_url }}
        run: node tools/submission-status.cjs receipt
