name: Publish K-drama pilgrimage map

on:
  push:
    branches: [main]
  issues:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: kdrama-pages
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and catalog
        run: |
          node --check script.js
          node --check submit.js
          node --check review.js
          node data/check-catalog.cjs
          node tools/test-flow.cjs

  publish:
    needs: validate
    if: ${{ !github.event.repository.private && (github.event_name != 'issues' || github.event.label.name == 'publish-approved') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure approval label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create publish-approved --repo "$GITHUB_REPOSITORY" --color 4A7C59 --description "Maintainer-approved map submission" --force
      - name: Import maintainer-approved Issue
        if: github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node -e "const fs=require('node:fs'); const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')); fs.writeFileSync('issue-body.md',event.issue.body || '');"
          node tools/import-issue.cjs issue-body.md "$ISSUE_NUMBER"
          rm issue-body.md
      - name: Validate catalog and scripts
        run: |
          node --check script.js
          node --check submit.js
          node --check review.js
          node data/check-catalog.cjs
      - name: Build static site
        run: node tools/build-site.cjs
      - name: Save approved catalog update
        if: github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! git diff --quiet -- data/catalog.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalog.js
            git commit -m "Publish approved pilgrimage submission #$ISSUE_NUMBER"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Close published Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "已审核并发布到巡礼地图。"
          gh issue close "$ISSUE_NUMBER"
