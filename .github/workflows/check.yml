name: Check K-drama site changes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and catalog
        run: |
          node --check script.js
          node --check boot.js
          node --check submit.js
          node --check review.js
          node --check tools/import-issue.cjs
          node data/check-catalog.cjs
          node tools/test-flow.cjs
      - name: Build site
        run: node tools/build-site.cjs
