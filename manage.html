<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>维护已发布内容 · 剧场之外</title><link rel="stylesheet" href="submit.css?v=10"><link rel="stylesheet" href="review.css?v=4"><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="vendor/maplibre-gl.css"><script src="./image-fallback.js?v=1" defer></script></head><body><main class="page review-page">
<header class="top"><a href="review.html">← 投稿审核</a><a href="index.html">返回地图</a></header><h1>维护已发布内容</h1><p class="intro">选择作品、地点或截图，修改后加入变更清单。检查整批变更，再去 GitHub 提交并批准。修改不会立即影响线上地图。</p>
<section class="review-panel"><label>搜索作品<input id="manage-search" type="search" placeholder="中文、韩文、别名"></label><label>作品<select id="manage-work"></select></label><div class="review-actions"><button data-entity="works" type="button">作品设置</button><button data-entity="landmarks" type="button">地点与分组</button><button data-entity="scenes" type="button">场景截图</button></div><label id="manage-item-label">选择内容<select id="manage-item"></select></label><form id="manage-form"><div id="manage-fields" class="two"></div><div id="manage-map" style="height:260px" hidden></div><img id="manage-image" class="manage-preview" alt="图片预览" hidden><button type="submit" class="submit-button">加入变更清单</button><button id="manage-delete" type="button" hidden>删除这条场景</button></form>
<details id="manage-bulk"><summary>批量分组、排序与合并</summary><p class="hint">勾选地点后统一设置分组。排序数越小越靠前；留空排序会按现有顺序展示。</p><div id="manage-selection" class="manage-selection"></div><label>统一分组（留空为未分组）<input id="manage-group"></label><button id="manage-group-apply" type="button">将选中地点加入分组变更</button><label>将当前地点合并到<select id="manage-merge-target"></select></label><p class="hint">合并会把截图移到目标地点，保留目标资料，旧地点链接跳转到目标。请先检查变更清单。</p><button id="manage-merge" type="button">加入合并变更</button></details></section>
<section class="review-panel"><h2>变更清单</h2><div id="manage-changes"></div><label class="check"><input id="manage-rights" type="checkbox">新增或替换的图片已有展示许可（未改图片可不选）</label><button id="manage-generate" type="button" class="submit-button">检查并生成维护投稿</button></section>
<section id="manage-result" class="review-panel" hidden><h2>提交维护变更</h2><p id="manage-instructions"></p><textarea id="manage-output" class="code-field" readonly></textarea><div class="review-actions"><button id="manage-copy" type="button">复制完整正文</button><a id="manage-github" target="_blank" rel="noopener noreferrer">前往 GitHub →</a></div></section><p id="manage-status" role="status"></p>
</main><script src="vendor/leaflet.js"></script><script src="vendor/maplibre-gl.js"></script><script src="vendor/leaflet-maplibre-gl.js"></script><script src="data/korea-map.js"></script><script src="data/catalog.js?v=14"></script><script src="site-config.js?v=3"></script><script src="maintenance-core.js?v=1"></script><script src="submission-core.js?v=3"></script><script src="manage.js?v=1"></script></body></html>
