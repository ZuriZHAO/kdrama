<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巡礼对比图 · 剧场之外</title><link rel="stylesheet" href="submit.css?v=10"><style>canvas{width:100%;height:auto;background:#f1f4f4;border-radius:8px}input[type=range]{padding:0}#compare-preview{margin:16px 0}.compare-note{font-size:12px;color:#73858b;line-height:1.7}</style></head><body><main class="page"><header class="top"><a id="compare-back" href="index.html">← 返回地图</a></header><h1>巡礼对比图</h1><p id="compare-title" class="intro"></p><p class="compare-note">选择实拍照片，在本机生成对比图。照片不会自动上传；只有点击分享并选择应用时才会交给该应用。排版设置保存在当前浏览器，照片需重新选择；请使用你有权分享的图片。</p><div class="two"><label>场景截图（无法自动加载时可选择本地图片）<input id="compare-scene" type="file" accept="image/jpeg,image/png,image/webp"></label><label>你的实拍照片<input id="compare-photo" type="file" accept="image/jpeg,image/png,image/webp"></label></div><div class="two"><label>实拍裁剪：左右<input id="compare-x" type="range" min="0" max="100" value="50"></label><label>实拍裁剪：上下<input id="compare-y" type="range" min="0" max="100" value="50"></label></div><div class="two"><label>截图裁剪：左右<input id="compare-sceneX" type="range" min="0" max="100" value="50"></label><label>截图裁剪：上下<input id="compare-sceneY" type="range" min="0" max="100" value="50"></label></div><label>显示方式<select id="compare-mode"><option value="side">并排对比</option><option value="vertical">上下对比</option><option value="overlay">滑动叠加</option><option value="blend">透明叠加对齐</option></select></label><div class="two"><label>截图放大<input id="compare-sceneZoom" type="range" min="100" max="300" value="100"></label><label>实拍放大<input id="compare-photoZoom" type="range" min="100" max="300" value="100"></label></div><p class="compare-note">可直接拖动预览中的图片调整位置。需要更多调整空间时，先放大对应图片；左右、上下滑块也可调整。</p><label id="compare-drag-label" hidden>叠加时拖动哪张图<select id="compare-drag-target"><option value="photo">实拍照片</option><option value="scene">场景截图</option></select></label><label id="compare-opacity-label" hidden>上层图片不透明度<input id="compare-opacity" type="range" min="0" max="100" value="50"></label><label id="compare-divider-label" hidden>对比位置<input id="compare-divider" type="range" min="0" max="100" value="50"></label><div class="two"><label>边框与间距<input id="compare-gap" type="range" min="0" max="60" value="12"></label><label>底色<input id="compare-background" type="color" value="#eeeeee"></label><label>导出宽度<select id="compare-size"><option value="1200">1200 像素</option><option value="1600" selected>1600 像素</option><option value="2400">2400 像素</option></select></label><label>图片格式<select id="compare-format"><option value="png">PNG</option><option value="jpeg">JPEG</option></select></label></div><label class="check"><input id="compare-caption" type="checkbox" checked>显示地点、作品与署名</label><label class="check"><input id="compare-swap" type="checkbox">交换截图和实拍位置</label><p class="compare-note">也可将图片拖到对应选图区。粘贴图片前先选择要替换的图片。</p><label>粘贴图片到<select id="compare-paste-target"><option value="photo">实拍照片</option><option value="scene">场景截图</option></select></label><label>实拍署名（可选）<input id="compare-credit" maxlength="80"></label><canvas id="compare-preview" width="1600" height="500" aria-label="场景截图与实拍对比预览"></canvas><button id="compare-download" type="button" class="submit-button" disabled>下载对比图</button><button id="compare-share" type="button" disabled>分享对比图</button><button id="compare-reset" type="button">重置排版</button><p id="compare-status" role="status"></p></main><script src="data/catalog.js?v=14"></script><script src="compare-core.js?v=2"></script><script src="compare.js?v=3"></script></body></html>
