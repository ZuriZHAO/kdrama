<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巡礼对比图 · 剧场之外</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f3;color:#26343c;font:15px/1.6 system-ui,sans-serif}main{max-width:840px;margin:auto;padding:18px 20px 40px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#366b67}h1{font-size:23px;margin:8px 0}#compare-title{color:#687976;margin:0 0 18px;font-size:13px}.pictures{display:flex;flex-direction:column;background:#eeeeee;gap:0;padding:0}.pictures.horizontal{flex-direction:row;align-items:stretch}.picture{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;flex:1;cursor:pointer;background:#e6ebe8;color:#6e8079;overflow:hidden;outline-offset:3px}.picture img[hidden]{display:none}.picture img{display:block;width:100%;height:auto}.pictures.horizontal .picture img[hidden]{display:none}.picture img{object-fit:contain;height:100%}.picture.empty{min-height:220px;aspect-ratio:16/9}.picture span{position:absolute;background:#ffffffdf;padding:6px 12px;border-radius:5px;font-size:13px;pointer-events:none}.picture:not(.empty) span{opacity:0;transition:opacity .15s}.picture:hover span,.picture:focus-within span{opacity:1}.picture input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.picture.dragover{outline:3px solid #39796e}.toolbar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px 0}.toolbar label{display:flex;align-items:center;gap:8px}input[type=range]{width:110px}input[type=color]{width:36px;height:28px;padding:1px;border:1px solid #bdc8c2}button{font:inherit;border:1px solid #bdc8c2;background:white;border-radius:6px;padding:8px 16px;cursor:pointer}button[aria-pressed=true],.primary{background:#39796e;color:white;border-color:#39796e}button:disabled{opacity:.45;cursor:default}.actions{text-align:center;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.hint{text-align:center;font-size:12px;color:#74857d;margin:16px 0}#compare-status{text-align:center;font-size:13px}dialog{border:0;border-radius:10px;max-width:min(900px,95vw);max-height:95vh;padding:16px}dialog::backdrop{background:#0008}#compare-result{display:block;max-width:100%;height:auto;max-height:65vh;object-fit:contain;margin:12px auto}dialog header{justify-content:space-between}canvas{display:none}@media(max-width:550px){main{padding:12px}h1{font-size:20px}header a{font-size:12px}.toolbar{gap:10px}.picture.empty{min-height:140px}.picture span{font-size:12px;padding:4px 8px}}
</style></head><body><main>
<header><h1>巡礼对比图</h1><a id="compare-back" href="index.html">返回地图</a></header>
<p id="compare-title">选择场景截图和实拍照片</p>
<div id="compare-pictures" class="pictures">
<label class="picture empty" id="scene-zone"><img id="scene-image" alt="场景截图" hidden><span>点击或拖入场景截图</span><input id="compare-scene" type="file" accept="image/jpeg,image/png,image/webp" aria-label="选择或替换场景截图"></label>
<label class="picture empty" id="photo-zone"><img id="photo-image" alt="实拍照片" hidden><span>点击或拖入实拍照片</span><input id="compare-photo" type="file" accept="image/jpeg,image/png,image/webp" aria-label="选择或替换实拍照片"></label>
</div>
<div class="toolbar"><label>边框 <input id="compare-gap" type="range" min="0" max="60" value="0"><output id="gap-value">0</output></label><label>底色 <input id="compare-background" type="color" value="#eeeeee"></label><div><button type="button" data-mode="vertical" aria-pressed="true">纵向</button> <button type="button" data-mode="side" aria-pressed="false">横向</button></div></div>
<div class="actions"><button id="compare-download" class="primary" type="button" disabled>保存对比图</button><button id="compare-share" type="button" disabled>分享图片</button></div>
<p class="hint">点击图片即可换图，也可以拖入或粘贴图片。图片保持完整比例，不裁掉画面。<br>照片只在当前浏览器处理，不会上传。</p><p id="compare-status" role="status" aria-live="polite"></p>
<canvas id="compare-preview"></canvas>
<dialog id="compare-save-dialog"><header><strong>对比图已生成</strong><button id="close-save" type="button">关闭</button></header><img id="compare-result" alt="生成的巡礼对比图，可长按保存"><p class="hint">手机可长按图片保存，也可下载文件。</p><div class="actions"><a id="save-file" download="kdrama-compare.png">下载图片</a></div></dialog>
</main><script src="data/catalog.js?v=16"></script><script src="./js/compare-core.js?v=3"></script><script src="./js/compare.js?v=4"></script></body></html>
