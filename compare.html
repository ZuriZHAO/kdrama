<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巡礼对比图 · 剧场之外</title><link rel="stylesheet" href="submit.css?v=10"><style>canvas{width:100%;height:auto;background:#f1f4f4;border-radius:8px}input[type=range]{padding:0}#compare-preview{margin:16px 0}.compare-note{font-size:12px;color:#73858b;line-height:1.7}</style></head><body><main class="page"><header class="top"><a id="compare-back" href="index.html">← 返回地图</a></header><h1>巡礼对比图</h1><p id="compare-title" class="intro"></p><p class="compare-note">选择实拍照片，在本机生成对比图。照片不会上传；请使用你有权分享的图片。</p><div class="two"><label>场景截图（无法自动加载时可选择本地图片）<input id="compare-scene" type="file" accept="image/jpeg,image/png,image/webp"></label><label>你的实拍照片<input id="compare-photo" type="file" accept="image/jpeg,image/png,image/webp"></label></div><div class="two"><label>实拍裁剪：左右<input id="compare-x" type="range" min="0" max="100" value="50"></label><label>实拍裁剪：上下<input id="compare-y" type="range" min="0" max="100" value="50"></label></div><label>显示方式<select id="compare-mode"><option value="side">并排对比</option><option value="overlay">滑动叠加</option></select></label><label id="compare-divider-label" hidden>对比位置<input id="compare-divider" type="range" min="0" max="100" value="50"></label><label>实拍署名（可选）<input id="compare-credit" maxlength="80"></label><canvas id="compare-preview" width="1600" height="500" aria-label="场景截图与实拍对比预览"></canvas><button id="compare-download" type="button" class="submit-button" disabled>下载对比图</button><p id="compare-status" role="status"></p></main><script src="data/catalog.js?v=14"></script><script src="compare.js?v=1"></script></body></html>
